<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src __CSP_SOURCE__ https: data:; media-src __CSP_SOURCE__ blob:; font-src __CSP_SOURCE__; style-src __CSP_SOURCE__ 'unsafe-inline'; script-src __CSP_SOURCE__ 'nonce-__CSP_NONCE__';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    %sveltekit.head%
    <script>
      try {
        const savedTheme = localStorage.getItem("glow.theme") ?? localStorage.getItem("sol.theme");
        const theme = savedTheme === "vscode" ? "editor" : savedTheme;
        document.documentElement.dataset.solTheme =
          theme === "light" || theme === "dark" || theme === "editor" ? theme : "editor";
      } catch {
        document.documentElement.dataset.solTheme = "editor";
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
