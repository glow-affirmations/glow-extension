name: Build attested VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag and public source
        run: |
          bun run verify:release "${GITHUB_REF_NAME}"
          bun run audit:public
          bun run audit:brand

      - name: Audit dependencies and notices
        run: |
          bun audit --audit-level high
          bun run licenses
          git diff --exit-code -- THIRD_PARTY_DEPENDENCIES.tsv

      - name: Run tests and checks
        run: |
          bun test
          bun run check

      - name: Package exactly one VSIX
        run: |
          VERSION="$(jq -r .version package.json)"
          mkdir -p release
          bunx vsce package \
            --no-dependencies \
            --baseImagesUrl https://justglow.dev \
            --out "release/glow-affirmations-${VERSION}.vsix"
          bun run audit:vsix "release/glow-affirmations-${VERSION}.vsix"
          unzip -Z1 "release/glow-affirmations-${VERSION}.vsix" > release/VSIX_CONTENTS.txt
          (cd release && sha256sum "glow-affirmations-${VERSION}.vsix" > SHA256SUMS)

      - name: Attest VSIX provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/glow-affirmations-*.vsix

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glow-affirmations-${{ github.ref_name }}
          path: |
            release/*.vsix
            release/SHA256SUMS
            release/VSIX_CONTENTS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --draft \
              --title "Glow Affirmations ${GITHUB_REF_NAME#v}" \
              --notes-from-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber
