name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Audit public tree
        run: |
          bun run audit:public
          bun run audit:brand

      - name: Audit dependencies and notices
        run: |
          bun audit --audit-level high
          bun run licenses
          git diff --exit-code -- THIRD_PARTY_DEPENDENCIES.tsv

      - name: Verify release metadata
        run: bun run verify:release

      - name: Run tests
        run: bun test

      - name: Run type and Svelte checks
        run: bun run check

      - name: Build extension
        run: bun run build
